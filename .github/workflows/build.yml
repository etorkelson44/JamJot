name: JamJot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Generate platform folders (web/ios/android) that aren't kept in the repo
      - run: flutter create . --project-name jamjot --org app.jamjot --platforms web,ios,android
      - run: flutter pub get
      - id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          { flutter analyze --no-fatal-infos --no-fatal-warnings \
            && flutter build web --release --base-href /JamJot/ ; } 2>&1 | tee /tmp/ci.txt
      - name: Publish failure log to ci-logs branch
        if: steps.compile.outcome == 'failure'
        working-directory: .
        run: |
          tail -c 60000 /tmp/ci.txt > /tmp/ci-tail.txt
          git config user.name "jamjot-ci"
          git config user.email "ci@jamjot.app"
          git checkout -B ci-logs
          cp /tmp/ci-tail.txt ci-log.txt
          git add ci-log.txt
          git commit -m "ci: failure log for ${{ github.sha }}"
          git push -f origin ci-logs
          exit 1
      - uses: actions/upload-pages-artifact@v3
        if: steps.compile.outcome == 'success'
        with:
          path: app/build/web

  deploy-preview:
    if: github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
