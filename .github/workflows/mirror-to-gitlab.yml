# Backup copy: every push to GitHub main (and tags) is copied to GitLab.
# GitLab then copies on to Codeberg. GitHub is the main repo; these are backups.
# Needs a repository secret named GITLAB_TOKEN (GitLab token with write_repository).
name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is missing; add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/jamjot/jamjot.git"
          git push --force gitlab HEAD:refs/heads/main
          git push --force gitlab --tags
