<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>JamJot — page not found</title>
  <!-- Having this file makes the host answer missing files with a real
       404 instead of the app page. App links all use jamjot.app/#/…,
       so they are unaffected. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FAF6EE; color: #26323E;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px 16px; box-sizing: border-box; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #55606B; }
    a { display: inline-block; background: #4A5FAE; color: #fff;
      text-decoration: none; padding: 12px 22px; border-radius: 999px;
      font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>That page isn't here.</h1>
    <p>Let's get you back to the jar.</p>
    <a href="/">Open JamJot</a>
  </main>
</body>
</html>
