name: jamjot
description: "JamJot — every minute of music goes in the jar."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  crypto: ^3.0.3
  record: ^5.1.2
  web: ^1.1.0
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/berries/
    - assets/market/
    - assets/backgrounds/
