name: jamjot
description: "JamJot — every minute of music goes in the jar."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  crypto: ^3.0.3
  record: ^5.1.2
  audioplayers: 6.8.1
  web: ^1.1.0
  http: ^1.2.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/art/
    - assets/art/avatar_instrument/
    - assets/art/avatar_instrument/jalapeno_violin/
    - assets/art/avatar_instrument/jalapeno_piano/
    - assets/art/avatar_instrument/jalapeno_viola/
    - assets/art/avatar_pose/kiwi_standing/
    - assets/art/avatar_pose/strawberry_standing/
    - assets/art/avatar_pose/jalapeno_standing/
    - assets/art/accessories/
    - assets/art/accessories/purple_glitter_crown/
    - assets/art/accessories/purple_glitter_crown/strawberry_standing/
    - assets/art/accessories/purple_glitter_crown/kiwi_standing/
    - assets/art/accessories/cat_eye_sunglasses/
    - assets/art/accessories/cat_eye_sunglasses/strawberry_standing/
    - assets/art/accessories/cat_eye_sunglasses/kiwi_standing/
    - assets/art/accessories/pink_ruffle_dress/
    - assets/art/accessories/pink_ruffle_dress/strawberry_standing/
    - assets/art/accessories/pink_ruffle_dress/kiwi_standing/
    - assets/art/accessories/lilac_platform_boots/
    - assets/art/accessories/lilac_platform_boots/strawberry_standing/
    - assets/art/accessories/lilac_platform_boots/kiwi_standing/
    - assets/instruments/
    - assets/art/jar/
    - assets/art/stoplight/
    - assets/audio/
